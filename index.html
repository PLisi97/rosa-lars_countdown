      #fffaf6;

    font-family: Arial, sans-serif;

    font-size: 22px;
    color: #8a6257;

    margin-bottom: 24px;

    font-family: Arial, sans-serif;

    grid-template-columns: repeat(3, 1fr);

    font-weight: 700;

    letter-spacing: .12em;
    color: #9a8179;

    margin-top: 46px;
    font-size: 14px;
    line-height: 1.6;
    color: #8c7770;

  @media (max-width: 760px) {
    body { padding: 12px; }
    .page { grid-template-columns: 1fr; min-height: auto; }

</head>
<body>
  <main class="page">
    <section class="photo" aria-label="Foto degli sposi"></section>
    <section class="content">
      <div class="eyebrow">Il conto alla rovescia</div>
      <div class="heart">♥</div>
      <h1>Il grande giorno</h1>
      <div class="date">5 Giugno 2027</div>

      <div id="days" class="days">—</div>
      <div class="days-label">giorni al matrimonio</div>

      <div class="units">
        <div class="unit">
          <span id="hours" class="number">—</span>
          <span class="label">ore</span>
        </div>
        <div class="unit">
          <span id="minutes" class="number">—</span>
          <span class="label">minuti</span>
        </div>
        <div class="unit">
          <span id="seconds" class="number">—</span>
          <span class="label">secondi</span>
        </div>
      </div>

      <div class="footer">
        Ogni giorno che passa è un giorno in meno<br>
        verso una giornata indimenticabile.
      </div>
    </section>
  </main>

<script>
  // Il countdown arriva all'inizio del 5 giugno 2027, usando l'ora locale del dispositivo.
  const target = new Date(2027, 5, 5, 0, 0, 0);

  function updateCountdown() {
    const now = new Date();
    let diff = target - now;

    if (diff <= 0) {
      document.getElementById("days").textContent = "0";
      document.getElementById("hours").textContent = "00";
      document.getElementById("minutes").textContent = "00";
      document.getElementById("seconds").textContent = "00";
      document.querySelector(".days-label").textContent = "oggi è il grande giorno ♥";
      return;
    }

    const totalSeconds = Math.floor(diff / 1000);
    const days = Math.floor(totalSeconds / 86400);
    const hours = Math.floor((totalSeconds % 86400) / 3600);
    const minutes = Math.floor((totalSeconds % 3600) / 60);
    const seconds = totalSeconds % 60;

    document.getElementById("days").textContent = days;
    document.getElementById("hours").textContent = String(hours).padStart(2, "0");
    document.getElementById("minutes").textContent = String(minutes).padStart(2, "0");
    document.getElementById("seconds").textContent = String(seconds).padStart(2, "0");
  }

  updateCountdown();
  setInterval(updateCountdown, 1000);
</script>
</body>
</html>
